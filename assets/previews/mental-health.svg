  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="820" height="430" rx="22" fill="url(#bg)"/>
  <rect x="32" y="34" width="756" height="362" rx="18" fill="#0f172a" opacity=".94"/>
